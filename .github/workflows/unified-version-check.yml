name: Unified version transition tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml

  windows-document-and-code:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Windows Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build native Windows Rust code engine
        shell: pwsh
        run: |
          cargo build --manifest-path rust/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw "Rust native build failed" }
          if (-not (Test-Path rust/target/release/documentcompare_core.dll)) { throw "Native Rust DLL is missing" }
      - name: Run regression suite
        env:
          DOCUMENTCOMPARE_REQUIRE_NATIVE: '1'
        shell: pwsh
        run: |
          dotnet run --project tests/DocumentCompare.Regression/DocumentCompare.Regression.csproj -c Release 2>&1 | Tee-Object -FilePath regression.txt
          if ($LASTEXITCODE -ne 0) { throw "Regression failed" }
          if (-not (Select-String -Path regression.txt -Pattern '^ALL REGRESSIONS PASSED$' -Quiet)) { throw "Missing regression completion marker" }
      - name: Verify production Rust-first document engine
        shell: pwsh
        run: |
          dotnet run --project tests/DocumentCompare.Regression/DocumentCompare.Regression.csproj -c Release --no-build -- --smoke-native-production
          if ($LASTEXITCODE -ne 0) { throw "Rust-first document engine smoke check failed" }
      - name: Verify portable Windows executable build
        run: dotnet publish csharp/DocumentCompare.Avalonia/DocumentCompare.Avalonia.csproj -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o dist/publish
