[package]
name = "documentcompare_core"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
description = "Experimental Rust text comparison core for DocumentCompare"

[lib]
name = "documentcompare_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "dc-code-diff"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.25.10"
tree-sitter-rust = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-general-category = "1"
regex = "1"
unicode-normalization = "0.1"
